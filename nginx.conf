server {
    listen 80;
    server_name your_domain.com;
    
    # Chuyển hướng tự động toàn bộ truy cập từ HTTP (80) sang HTTPS (443)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your_domain.com;

    # Đường dẫn tới file chứng chỉ SSL (Ví dụ cấu hình chuẩn của Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;

    # Các chuẩn bảo mật SSL khuyên dùng (ngăn chặn SSL downgrade)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cấu hình log (tuỳ chọn)
    access_log /var/log/nginx/fullstack-app.access.log;
    error_log /var/log/nginx/fullstack-app.error.log;

    location / {
        # Trỏ tới ứng dụng Docker đang chạy ở port 5000
        proxy_pass         http://127.0.0.1:5000;
        
        # Các header cần thiết cho ứng dụng ASP.NET Core (Kestrel)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "keep-alive";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Chuyển tiếp các thông tin IP thực của người dùng
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
