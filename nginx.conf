server {
    listen 80;
    # Thay 'your_domain.com' bằng tên miền thực tế hoặc địa chỉ IP của bạn
    server_name your_domain.com;

    # Cấu hình log (tuỳ chọn)
    access_log /var/log/nginx/fullstack-app.access.log;
    error_log /var/log/nginx/fullstack-app.error.log;

    location / {
        # Trỏ tới ứng dụng đang chạy ở port 5000
        proxy_pass         http://127.0.0.1:5000;
        
        # Các header cần thiết cho ứng dụng ASP.NET Core (Kestrel)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Chuyển tiếp các thông tin IP thực của người dùng
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
